name: Bug report
description: Something behaves differently from how it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it
      options:
        - Local (venv + yarn dev)
        - Docker, dev profile
        - Docker, prod profile
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove any credentials first.
      render: shell
