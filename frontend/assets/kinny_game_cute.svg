<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <linearGradient id="cuteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCC33; stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Kinny text playful -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="Comic Sans MS, cursive"
        font-size="120"
        fill="url(#cuteGradient)"
        stroke="#FF7F50"
        stroke-width="2">
    Kinny
  </text>
  <!-- Pet ears on K -->
  <path d="M270 120 C260 70, 290 70, 280 120" fill="#FFCC33" />
  <path d="M300 120 C290 70, 320 70, 310 120" fill="#FFCC33" />
  <!-- Heart tail on y -->
  <path d="M640 260 C660 290, 680 250, 660 230 
           C640 250, 620 290, 640 260 Z" 
        fill="#FF7F50" />
  <!-- Vegetable icons (carrot & tomato) -->
  <circle cx="450" cy="140" r="15" fill="#FF6347" stroke="#8B0000" stroke-width="2"/>
  <rect x="470" y="120" width="12" height="25" rx="6" fill="#FF8C00" stroke="#8B4513" stroke-width="2"/>
</svg>